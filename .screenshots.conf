# Read by the shared `screenshots` runner in Repos/Scripts. Anything not set takes that script's
# defaults — device names, canvas size, and the wallpaper backdrop.

PROJECT="Space UI.xcodeproj"
SCHEME="Screenshots"
APP_BUNDLE_ID="com.jaydenirwin.spaceui"
MAC_APP_NAME="Space UI"
# tvOS ships too, but the runner has no tvOS slot yet; "TV 1-3.png" sit in the output folder by hand
# and `--upload` still sends them.
PLATFORMS="iphone duo ipad mac vision"

# Living Room (Night), so the console glows the way it does in a dim room.
VISION_ENVIRONMENT="LivingRoomNight"

# The HomeKit lights shot ("Old (Manual)/<Device> Lights.png", resized to the store's sizes) closes
# each listing.
IPHONE_MANUAL_SHOTS="5"
IPAD_MANUAL_SHOTS="5"
MAC_MANUAL_SHOTS="5"

# The App Store app is a Catalyst build, not a native Mac one, so "platform=macOS" alone matches no
# destination — the variant has to be named.
MAC_DESTINATION="platform=macOS,variant=Mac Catalyst"

# The app is a full-screen console, not a document window, so the Mac shots are taken in full screen
# (ScreenshotMode.prepareMacWindows) and fitted onto black rather than placed as a window on the wallpaper.
MAC_FILL_CANVAS=true

# What each shot shows, for the "Screenshots.md" the run writes beside them. Keyed by the UI test's
# capture name without its "NN-" prefix. Every page is generated from its own seed (listed in
# ScreenshotTests.swift), so the set is four different interfaces rather than four views of one.
SHOT_DESCRIPTIONS="
  galaxy      = The Galaxy page, the star map (seed 31)
  lock-screen = The Lock Screen page (seed 21)
  planet      = The Planet page, a planetary scan readout (seed 38)
  nearby      = The Nearby page, the ships and objects around the vessel (seed 1)
  Phone 6.3 5 = Hand-made: the console driving the room's HomeKit lights
  Pad 13 5    = Hand-made: the console driving the room's HomeKit lights
  Mac 5       = Hand-made: the console driving the room's HomeKit lights
"

# /spaceui/ shows the iPad shots, in the landscape iPad frame: a console reads best on the big screen.
WEBSITE_SLUG="spaceui"
WEBSITE_DEVICE="ipad"

# The headline each shot is sold under on that page, keyed like SHOT_DESCRIPTIONS. The consoles
# speak for themselves, so they are shown picture-only (empty value); only the HomeKit shot, which
# shows something a screen can't, gets words.
SHOT_PROMOS="
  galaxy      =
  lock-screen =
  planet      =
  nearby      =
  Pad 13 5    = Your room's HomeKit lights glow in the console's colours.
"
